#
# 京东云一代 (MT7621) OpenWrt 云编译固件
# 主题: Argon | 语言: 中文 | 可自定义 IP 和密码
#
# 使用方法:
# 1. 将此文件放入你的 GitHub 仓库的 .github/workflows/ 目录
# 2. 在 GitHub 上进入 Actions 标签页
# 3. 选择此工作流，点击 "Run workflow" 运行
# 4. 等待编译完成（约 1-2 小时），在 Artifacts 下载固件
#

name: 京东云一代 OpenWrt 编译 (Argon/中文)

on:
  workflow_dispatch:
    inputs:
      ip_address:
        description: '默认 IP 地址 (留空使用 192.168.1.1)'
        required: false
        default: '192.168.1.1'
        type: string
      root_password:
        description: 'Root 密码 (留空表示无密码)'
        required: false
        default: ''
        type: string
      firmware_version:
        description: '固件版本号 (可选)'
        required: false
        default: 'custom'
        type: string

env:
  OPENWRT_VERSION: '23.05.5'
  TARGET_DEVICE: 'jdcloud-re-sp-01b'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk gcc-multilib flex git gettext \
            libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: 下载 OpenWrt 源码
        run: |
          git clone --depth 1 -b v${{ env.OPENWRT_VERSION }} \
            https://github.com/openwrt/openwrt.git openwrt

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 添加 Argon 主题
        working-directory: openwrt
        run: |
          cd package
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git
          cd ..

      - name: 配置固件
        working-directory: openwrt
        run: |
          cat > .config << 'EOF'
          # 目标设备: 京东云一代 MT7621
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud-re-sp-01b=y

          # LuCI 界面
          CONFIG_PACKAGE_luci=y

          # Argon 主题
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          # 中文语言包
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wol-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vnstat-zh-cn=y

          # 常用工具
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-vnstat2=y

          # 网络工具
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          # 无线驱动
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt76x2=y
          CONFIG_PACKAGE_wpad-openssl=y

          # 文件系统
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_e2fsprogs=y

          # 其他工具
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          EOF

          # 应用配置
          make defconfig

      - name: 设置默认 IP
        working-directory: openwrt
        if: github.event.inputs.ip_address != '192.168.1.1'
        run: |
          # 修改默认 IP
          sed -i "s/192.168.1.1/${{ github.event.inputs.ip_address }}/g" \
            package/base-files/files/bin/config_generate

      - name: 设置 Root 密码
        working-directory: openwrt
        if: github.event.inputs.root_password != ''
        run: |
          # 设置 root 密码 (使用 openssl 生成加密密码)
          PASSWORD=$(openssl passwd -1 "${{ github.event.inputs.root_password }}")
          sed -i "s/root::0:0:99999:7:::/\$PASSWORD/g" \
            package/base-files/files/etc/shadow

      - name: 开始编译
        working-directory: openwrt
        run: |
          echo "开始编译..."
          make -j$(nproc) || make -j1 V=s

      - name: 整理固件文件
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/ -name "*.bin" -o -name "*.img" | \
            xargs -I {} cp {} firmware/
          ls -lh firmware/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: 京东云一代-OpenWrt-Argon-中文-${{ github.event.inputs.firmware-version }}
          path: firmware/
          retention-days: 30
